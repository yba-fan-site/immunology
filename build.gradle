plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '1.20.1-1.0.17-port1'
group = 'dev.krysztal.immunology'
archivesBaseName = 'immunology'
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { immunology { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { immunology { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'immunology',
            'Specification-Vendor': 'Immunology compatibility port',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        ])
    }
}
